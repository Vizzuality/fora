  "/api/v1/members/investments":
    get:
      summary: List all investments for current member
      tags:
      - Investments
      security:
      - Bearer: []
      parameters:
      - name: filter[project_id]
        in: query
        description: Filter results only for specified project
        required: false
        schema:
          type: string
      - name: page[number]
        in: query
        description: 'Page number. Default: 1'
        required: false
        schema:
          type: integer
      - name: page[size]
        in: query
        description: 'Per page items. Default: 10'
        required: false
        schema:
          type: integer
      - name: sort[attribute]
        in: query
        enum:
        - project_name
        - amount
        - year_invested
        - funding_type
        - capital_type
        description: "Attributes usable for sorting. Default: created_at:\n * `project_name`
          \n * `amount` \n * `year_invested` \n * `funding_type` \n * `capital_type`
          \n "
        required: false
        schema:
          type: string
      - name: sort[direction]
        in: query
        enum:
        - asc
        - desc
        description: 'Possible directions of sorting. Default: desc'
        required: false
        schema:
          type: string
      - name: disable_pagination
        in: query
        description: Turn off pagination
        required: false
        schema:
          type: boolean
      - name: fields[investment]
        in: query
        description: Get only required fields. Use comma to separate multiple fields
        required: false
        schema:
          type: string
      - name: includes
        in: query
        description: Include relationships. Use comma to separate multiple fields
        required: false
        schema:
          type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                errors:
                - title: Unauthorized
              schema:
                "$ref": "#/components/schemas/errors"
