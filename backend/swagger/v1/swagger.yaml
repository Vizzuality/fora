            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
    put:
      summary: Resets password
      tags:
      - Reset Password
      parameters: []
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiJ9.eyJtZW1iZXJfaWQiOiJmNzAxMGEwNS0xYWI5LTRkMjEtYmNhZS1iMDJmNDIxNzk1ZTIiLCJleHAiOjE3MzQ3OTU0NDB9.MO-E9JnsHW7rmH7L0Kp1PaYZ7qEoi5IqthFbIIlnp2Y
              schema:
                type: object
                properties:
                  token:
                    type: string
        '422':
          description: Invalid, expired token
          content:
            application/json:
              example:
                errors:
                - title: Reset password token is invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                password_confirmation:
                  type: string
                reset_password_token:
                  type: string
              required:
              - email
              - password_confirmation
              - reset_password_token
