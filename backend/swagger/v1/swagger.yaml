  "/api/v1/reset_password":
    post:
      summary: Sends an email with reset password path and token
      tags:
      - Reset Password
      parameters: []
      responses:
        '200':
          description: success
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
    put:
      summary: Resets password
      tags:
      - Reset Password
      parameters: []
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiJ9.eyJtZW1iZXJfaWQiOiIzMWUzMjUwMi1lMmJjLTQyMjMtOTk0Ny1iYjMyOGRjMzU2ZjgiLCJmaXJzdF9uYW1lIjoiRGF3bmEiLCJsYXN0X25hbWUiOiJCbG9jayIsImVtYWlsIjoibWVtYmVyQGV4YW1wbGUuY29tIiwiZXhwIjoxNzQxNzUwNTk5fQ.Vx3CrPn60VyxbpuqeNZcsR7lkb7VXhTFXXO9rOjiJpU
              schema:
                type: object
                properties:
                  token:
                    type: string
        '422':
          description: Invalid, expired token
          content:
            application/json:
              example:
                errors:
                - title: Reset password token is invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                password_confirmation:
                  type: string
                reset_password_token:
                  type: string
              required:
              - email
              - password_confirmation
              - reset_password_token
