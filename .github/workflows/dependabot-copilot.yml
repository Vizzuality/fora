name: Vulns
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  assign-to-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch alerts and create PRs for Copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_SECURITY_EVENTS }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const alerts = await github.rest.dependabot.listAlertsForRepo({
              owner,
              repo,
              state: 'open',
              severity: 'high,critical'
            });

            console.log('Total open alerts:', alerts.data.length);

            for (const alert of alerts.data) {
              const branchName = `copilot/fix-dependabot-alert-${alert.number}`;

              // Check if a PR already exists for this alert
              const existingPRs = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branchName}`,
                state: 'open'
              });

              if (existingPRs.data.length > 0) {
                console.log(`PR already exists for alert #${alert.number}, skipping`);
                continue;
              }

              console.log(`Creating PR for alert #${alert.number}:`, alert.security_advisory.summary);

              // Get the default branch SHA
              const repoData = await github.rest.repos.get({ owner, repo });
              const baseBranch = repoData.data.default_branch;
              const baseRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${baseBranch}`
              });
              const baseSha = baseRef.data.object.sha;

              // Create branch
              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branchName}`,
                  sha: baseSha
                });
              } catch (e) {
                if (e.status === 422) {
                  console.log(`Branch ${branchName} already exists, skipping`);
                  continue;
                }
                throw e;
              }

              // Create a placeholder file so the branch has a diff
              const filePath = `.copilot/dependabot-alert-${alert.number}.md`;
              const fileContent = [
                `# Dependabot Alert #${alert.number}`,
                '',
                `**Summary:** ${alert.security_advisory.summary}`,
                `**Severity:** ${alert.security_advisory.severity}`,
                `**Package:** ${alert.dependency.package.name}`,
                '',
                'This file was created to trigger a Copilot fix. It can be removed after the vulnerability is resolved.'
              ].join('\n');

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: filePath,
                message: `fix: address dependabot alert #${alert.number}`,
                content: Buffer.from(fileContent).toString('base64'),
                branch: branchName
              });

              // Create the PR
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: `[Security] Fix dependabot alert #${alert.number}: ${alert.security_advisory.summary}`,
                head: branchName,
                base: baseBranch,
                body: [
                  '## Dependabot Security Alert',
                  '',
                  '```json',
                  JSON.stringify(alert, null, 2),
                  '```',
                  '',
                  '## Task',
                  '',
                  'Analyze the alert above and fix the vulnerability.',
                  '- Update the affected dependency to the patched version if available.',
                  '- If no patch exists, evaluate mitigations or alternatives.',
                  '- Run the existing tests to confirm nothing breaks.',
                  `- Advisory references: ${alert.security_advisory.references?.map(r => r.url).join(', ') ?? 'N/A'}`
                ].join('\n')
              });

              // Comment with @copilot to assign it
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.data.number,
                body: [
                  '@copilot',
                  '',
                  '## Dependabot Security Alert',
                  '',
                  '```json',
                  JSON.stringify(alert, null, 2),
                  '```',
                  '',
                  '## Task',
                  '',
                  'Analyze the alert above and fix the vulnerability.',
                  '- Update the affected dependency to the patched version if available.',
                  '- If no patch exists, evaluate mitigations or alternatives.',
                  '- Run the existing tests to confirm nothing breaks.',
                  `- Advisory references: ${alert.security_advisory.references?.map(r => r.url).join(', ') ?? 'N/A'}`
                ].join('\n')
              });

              console.log(`PR created for alert #${alert.number}:`, pr.data.html_url);
            }
